# Reverse-proxy конфигурация Apache 2.4 для Streamlit-приложения.
#
# Streamlit не отдаёт статические файлы как обычный веб-сервер — он держит
# собственный сервер (Tornado) и общается с браузером в том числе по
# WebSocket (для интерактивности виджетов). Поэтому Apache здесь работает
# как обратный прокси и должен поддерживать проброс WebSocket-соединений.
#
# Требуемые модули (включить командой a2enmod на Debian/Ubuntu,
# либо раскомментировать LoadModule-строки в httpd.conf на Windows):
#   proxy, proxy_http, proxy_wstunnel, rewrite, headers

<VirtualHost *:80>
    ServerName ai1c-academy.local
    # ServerAlias www.ai1c-academy.local

    ProxyPreserveHost On
    ProxyRequests Off

    # Проброс WebSocket (нужен для "живых" обновлений виджетов Streamlit)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8501/$1" [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/?(.*) "http://127.0.0.1:8501/$1" [P,L]

    ProxyPass "/" "http://127.0.0.1:8501/"
    ProxyPassReverse "/" "http://127.0.0.1:8501/"

    ErrorLog "${APACHE_LOG_DIR}/ai1c-academy-error.log"
    CustomLog "${APACHE_LOG_DIR}/ai1c-academy-access.log" combined
</VirtualHost>

# Для HTTPS добавьте отдельный <VirtualHost *:443> с SSLEngine on
# и теми же директивами ProxyPass/RewriteRule.
