[server]
headless = true
address = "127.0.0.1"
port = 8501
enableCORS = false
enableXsrfProtection = false
# Позволяет отдавать приложение через Apache reverse-proxy на том же хосте.

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7c5cff"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#161d2e"
textColor = "#e6e9f2"
font = "sans serif"
